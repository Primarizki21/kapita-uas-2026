<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" width="920" height="240" role="img" aria-label="Adapted three-module prompt pipeline with a judge">
  <g fill="none" stroke="#000000" stroke-width="1.5" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">
    <text x="460" y="24" stroke="none" font-size="16" font-weight="bold">Adapted prompt pipeline (EXP-001)</text>

    <rect x="15" y="70" width="150" height="90"/>
    <text x="90" y="100">ITSP item</text>
    <text x="90" y="120" font-size="12">statement + buggy C</text>
    <text x="90" y="140" font-size="12">+ correct C + tests</text>

    <rect x="205" y="70" width="150" height="90"/>
    <text x="280" y="100">1. Contextualization</text>
    <text x="280" y="122" font-size="12">five candidate</text>
    <text x="280" y="140" font-size="12">debugging tasks</text>

    <rect x="395" y="70" width="150" height="90"/>
    <text x="470" y="100">2. Personalization</text>
    <text x="470" y="122" font-size="12">pair profile selects</text>
    <text x="470" y="140" font-size="12">one candidate</text>

    <rect x="585" y="70" width="150" height="90"/>
    <text x="660" y="100">3. Socialization</text>
    <text x="660" y="122" font-size="12">four labelled social</text>
    <text x="660" y="140" font-size="12">sections, fix hidden</text>

    <rect x="775" y="70" width="130" height="90"/>
    <text x="840" y="100">Judge</text>
    <text x="840" y="122" font-size="12">four scores</text>
    <text x="840" y="140" font-size="12">on a 1-5 scale</text>

    <path d="M165 115 L200 115" marker-end="url(#arrow)"/>
    <path d="M355 115 L390 115" marker-end="url(#arrow)"/>
    <path d="M545 115 L580 115" marker-end="url(#arrow)"/>
    <path d="M735 115 L770 115" marker-end="url(#arrow)"/>

    <text x="460" y="200" font-size="12">gcc compile and embedded tests check validity before generation</text>
    <text x="460" y="220" font-size="12">one model, deepseek-v4.1-flash, prompt engineering only</text>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#000000"/>
    </marker>
  </defs>
</svg>
